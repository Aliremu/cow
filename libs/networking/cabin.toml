[package]
name = "networking"
version = "0.1.0"
cxx-standard.workspace = true

[target.tcp]
type = "library"
sources = ["src/tcp.cpp"]
include-dirs = ["src"]

[target.main]
type = "executable"
sources = ["src/main.cpp"]
include-dirs = ["src"]
defines = ["SPDLOG_USE_STD_FORMAT"]
deps = ["tcp", "spdlog"]

[target.server]
type = "executable"
sources = ["src/server.cpp"]
include-dirs = ["src"]

[target.client]
type = "executable"
sources = ["src/client.cpp"]
include-dirs = ["src"]

[dependencies]
spdlog = { version = "=1.17.0", port = true }
