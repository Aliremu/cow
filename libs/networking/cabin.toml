[package]
name = "networking"
version = "0.1.0"
cxx-standard.workspace = true

[target.main]
type = "executable"
sources = ["src/main.cpp"]
include-dirs = ["src"]
deps = ["spdlog"]

[target.server]
type = "executable"
sources = ["src/server.cpp"]
include-dirs = ["src"]

[target.client]
type = "executable"
sources = ["src/client.cpp"]
include-dirs = ["src"]

[dependencies]
spdlog = { version = "=1.17.0", port = true }
