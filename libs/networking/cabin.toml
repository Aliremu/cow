[package]
name = "networking"
version = "0.1.0"
cxx-standard.workspace = true

[profile]
cxxflags = ["-freflection"]

[target.tcp]
type = "library"
sources = [
  "src/tcp.cpp",
  "src/router.cpp"
]
include-dirs = ["src"]

[target.main]
type = "executable"
sources = ["src/main.cpp"]
include-dirs = ["src"]
defines = ["SPDLOG_USE_STD_FORMAT"]
deps = ["tcp", "spdlog"]

[dependencies]
spdlog = { version = "=1.17.0", port = true }
