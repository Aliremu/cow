[target.atomic-wait]
type = "executable"
sources = ["examples/05_atomic_wait.cpp"]

[target.promise-future]
type = "executable"
sources = ["examples/06_promise_future.cpp"]

[target.async-task]
type = "executable"
sources = ["examples/07_async_task.cpp"]

[target.latch]
type = "executable"
sources = ["examples/08_latch.cpp"]

[target.barrier]
type = "executable"
sources = ["examples/09_barrier.cpp"]

[target.semaphore]
type = "executable"
sources = ["examples/10_semaphore.cpp"]

[target.shared-mutex]
type = "executable"
sources = ["examples/11_shared_mutex.cpp"]

[target.coroutine-basics]
