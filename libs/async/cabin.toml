[package]
name = "async"
version = "0.1.0"
cxx-standard.workspace = true

[target.async]
type = "library"
sources = ["src/async.cpp"]
include-dirs = ["src"]

[target.thread-lifecycle]
type = "executable"
sources = ["examples/01_thread_lifecycle.cpp"]

[target.jthread-stop]
type = "executable"
sources = ["examples/02_jthread_stop.cpp"]

[target.mutex-counter]
type = "executable"
sources = ["examples/03_mutex_counter.cpp"]

[target.condition-variable]
type = "executable"
