[workspace]
members = [
  "libs/*",
  "apps/*",
]
default-members = [
  "libs/core",
  "libs/std",
  "apps/web",
  "apps/client",
]
cxx-standard = "c++26"

[toolchain]
cc = "gcc"
cxx = "g++"
ar = "ar"

[workspace.dependencies]
networking = { path = "libs/networking"}
std = { path = "libs/std" }
"cabin-ports/spdlog" = "=1.17.0"

[workspace.dev-dependencies]
"cabin-ports/googletest" = "=1.17.0"
